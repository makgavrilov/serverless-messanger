[project]
name = "my-project"
version = "0.1.0"
description = "Описание вашего проекта"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "fastapi[standard]",
    "pydantic",
]

[project.optional-dependencies]
dev = [
    "mypy",
    "ruff",
    "black",
]

[tool.mypy]
strict = true
warn_unused_ignores = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN",
    "D100",
    "D104",
    "D415",
    "TD",
    "FIX",
    "RUF001",
    "RUF002",
    "RUF003",
    "DTZ",
]